          content:
            application/json:
              schema:
                type: object

  /scaling/services/{serviceId}/history:
    get:
      tags:
        - Scaling
      summary: Scaling history
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServiceIdParam'
      responses:
        '200':
          description: Scaling events for the service
          content:
            application/json:
              schema:
