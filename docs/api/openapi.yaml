          type: string
          enum: [production, preview, development]
          description: Deployment environment
        git_repo:
          type: string
          description: Connected git repository
        git_branch:
          type: string
          description: Connected git branch
        build_path:
          type: string
          description: Build context path
        cpu:
          type: string
          description: CPU allocation
        memory:
          type: string
          description: Memory allocation
        replicas:
          type: integer
          description: Desired replica count
        port:
          type: integer
          description: Container port to expose (published host port, or Traefik when domain set)
        domain:
          type: string
          description: Public hostname routed via Traefik
        healthcheck_path:
          type: string
          description: HTTP path probed on port for container health
        restart_policy:
          type: string
          description: Docker restart policy (default unless-stopped)
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/ServiceVolume'
          description: Volume/bind mounts applied to every replica
        domains:
          type: array
          items:
            $ref: '#/components/schemas/ServiceDomain'
          description: All attached hostnames; `domain` is the derived default
        maintenance_mode:
          type: boolean
          description: Redirect all traffic to the platform maintenance page
        basic_auth:
          type: array
          items:
            type: string
          description: Basic-auth usernames gating the route (hashes never returned)
        builder:
          type: string
          enum: [auto, railpack, nixpacks, dockerfile, static]
          description: Build strategy; auto detects from repo contents
        cpu_reserve:
          type: string
          description: Soft CPU reservation (fraction, e.g. 0.25 → ~256 CPU shares)
        memory_reserve:
          type: string
          description: Soft memory reservation (e.g. 128Mi)
        static_build_cmd:
          type: string
          description: Build command for the static builder (default "npm ci && npm run build")
        static_dir:
          type: string
          description: Output directory for the static builder (default dist)
        sleep_enabled:
          type: boolean
          description: Scale to zero after sleep_idle_minutes without inbound traffic; a wake placeholder answers requests while the service resumes
        sleep_idle_minutes:
          type: integer
          description: Idle timeout in minutes before sleeping (1-1440, default 15)
        node_id:
          type: string
          description: Node agent id this service is pinned to; empty/null = local Docker host. 'auto' on create/update resolves to the least-loaded online agent. Git-sourced services build on the node itself (build context ships as an agent-token artifact); rollbacks of locally-built tags ship the image via docker save/load.
        node_name:
          type: string
          description: Display name of the pinned node agent (read-only)
        spread:
          type: boolean
          description: Replicas are distributed across every online, schedulable node agent (replica i → agents[i mod n]). Mutually exclusive with an explicit node_id pin.
        placement_tags:
          type: array
          items: { type: string }
          description: Node tags required for remote placement — auto/spread only consider agents carrying every tag; re-resolved each reconcile. Mutually exclusive with an explicit node_id pin (read-only on responses when a pin is set).
        traefik_labels:
          type: object
          additionalProperties: { type: string }
          description: Extra Traefik middlewares defined for this service's router — keys 'middlewares.<name>.<type>[.<field>]' (e.g. 'middlewares.rl.ratelimit.average'), allowlist-validated; each defined middleware attaches to the router after builtins
        public_url:
          type: string
          description: Computed public URL (published port or domain)
        created_at:
          type: string
          format: date-time
          description: Service creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

