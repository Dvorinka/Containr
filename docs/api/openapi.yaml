          description: Upgrade status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeStatus'

  /system/upgrade/pull:
    post:
      tags:
        - System
      summary: Pull upgrade image
      description: Pull the latest Containr image and restart the stack to self-upgrade.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Upgrade started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /system/host:
    get:
