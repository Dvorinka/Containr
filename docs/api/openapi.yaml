                    items:
                      $ref: '#/components/schemas/CronExecution'

  /cron-jobs/{id}/trigger:
    post:
      tags:
        - Cron
      summary: Trigger cron job now
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronExecution'

  # API Gateway (merged APwhy management surface)
  /gateway/services:
    get:
      tags:
        - Gateway
      summary: List gateway services
      description: Upstream services registered for key-gated proxying.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Gateway services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'
    post:
      tags:
        - Gateway
      summary: Register gateway service
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayServiceRequest'
      responses:
        '201':
          description: Service registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Name or route prefix already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gateway/services/{id}:
    patch:
      tags:
        - Gateway
      summary: Enable/disable gateway service
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Service updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'

  /gateway/services/{id}/validate:
    get:
      tags:
        - Gateway
      summary: Validate upstream reachability
      description: Probes the service's upstream health path and records the result.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Validation result (reachable flag + status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'

  /gateway/keys:
    get:
      tags:
        - Gateway
      summary: List API keys
      security:
        - bearerAuth: []
      responses:
        '200':
          description: API keys (hashes never returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'
    post:
      tags:
        - Gateway
      summary: Issue API key
      description: The plaintext key is returned exactly once in this response.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayAPIKeyRequest'
      responses:
        '201':
          description: Key issued — `key` field holds the plaintext token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'
        '400':
          description: Invalid input or unknown plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gateway/keys/{id}:
    patch:
      tags:
        - Gateway
      summary: Enable/disable API key
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Key updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'

  /gateway/analytics/ops:
    get:
      tags:
        - Gateway
      summary: Operations analytics
      description: Error rates, incident counts, and uptime per gateway service.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ops analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'

  /gateway/analytics/traffic:
    get:
      tags:
        - Gateway
      summary: Traffic analytics
      description: Request volume timeseries per gateway service.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Traffic analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: containr-api
        version:
          type: string
          example: 1.0.0

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          format: password
          description: User password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
        user:
          $ref: '#/components/schemas/User'

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          format: password
          description: User password
        name:
          type: string
          description: User display name

    User:
      type: object
      properties:
        id:
          type: string
          description: User ID
        email:
          type: string
          format: email
          description: User email
        name:
          type: string
          description: User display name
        avatar_url:
          type: string
          description: Optional avatar image URL
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          description: User display name
        email:
          type: string
          format: email
          description: User email address
        avatar_url:
          type: string
          description: Optional avatar image URL

    Project:
