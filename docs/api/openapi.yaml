        from_replicas:
          type: integer
        to_replicas:
          type: integer
        reason:
          type: string
        trigger:
          type: string
          description: auto | manual
        created_at:
          type: string
          format: date-time

    FailoverPolicy:
      type: object
      required:
        - service_id
      properties:
        service_id:
          type: string
        enabled:
          type: boolean
        min_healthy_nodes:
          type: integer
        max_failures:
          type: integer
        failover_timeout:
          type: integer
          description: Nanoseconds
        recovery_timeout:
          type: integer
          description: Nanoseconds
        failover_strategy:
          type: string
        backup_nodes:
          type: array
          items:
            type: string
        health_check_config:
          type: object

    HealthCheck:
      type: object
      properties:
        id:
          type: string
        service_id:
          type: string
        node_id:
          type: string
        type:
          type: string
          description: http | tcp | exec
        config:
          type: object
        last_check:
          type: string
          format: date-time
        status:
          type: string

    AlertRule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        condition:
          type: object
          description: metric, operator, threshold, duration
        severity:
          type: string
          enum: [info, warning, critical]
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        notifiers:
          type: array
          items:
            type: string
        cooldown:
          type: integer
          description: Nanoseconds

    Notifier:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          description: webhook | slack | email | discord
        config:
          type: object

    NotifierRequest:
      type: object
      required:
        - type
        - config
      properties:
        id:
          type: string
        type:
          type: string
        config:
          type: object

    NodeAgent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        hostname:
          type: string
        ip_address:
          type: string
        port:
          type: integer
        status:
          type: string
          description: online | offline | connecting | error
        version:
          type: string
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        resources:
          $ref: '#/components/schemas/NodeResources'
        metadata:
          type: object
          additionalProperties: true
        auto_prune:
          type: boolean
          description: Enqueue a bounded docker prune on this node once per day.
        schedulable:
          type: boolean
          description: >-
            False on a cordoned/drained node — `auto` placement skips it and
            new explicit pins are rejected.
        tags:
          type: array
          items: { type: string }
          description: Operator-set placement labels; services with placement_tags require all of them on the target node.
        default_domain:
          type: string
          description: >-
            Node base domain — services placed on this node (pin or spread)
            with no explicit service_domains get `<name>.<default_domain>`
            hostnames automatically. Wildcard DNS for `*.<default_domain>`
            must resolve to the Containr edge.
        last_heartbeat:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentAuthToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        revoked_at:
          type: string
          format: date-time
      required:
        - id
        - label
        - created_at
        - revoked

    AgentAuthTokenCreated:
      allOf:
        - $ref: '#/components/schemas/AgentAuthToken'
        - type: object
          properties:
            token:
              type: string
              description: Raw token value, returned exactly once at creation
          required:
            - token

    CreateAgentTokenRequest:
      type: object
      properties:
        label:
          type: string
          description: Human-readable label for the token (e.g. node name)

    UserToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
          description: First 12 chars of the token, for identification in lists
        scope:
          type: string
          enum: [read, write, admin]
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - key_prefix
        - scope
        - created_at

    UserTokenCreated:
      allOf:
        - $ref: '#/components/schemas/UserToken'
        - type: object
          properties:
            token:
              type: string
              description: Raw cnp_ token value, returned exactly once at creation
          required:
            - token

    CreateUserTokenRequest:
      type: object
      properties:
        name:
          type: string
          description: Human-readable label (e.g. "laptop cli", "ci deploy")
        scope:
          type: string
          enum: [read, write, admin]
          default: write
          description: read = GET/HEAD only; write = all non-admin routes; admin = everything (requires admin account)
        expires_in_days:
          type: integer
          minimum: 0
          maximum: 3650
          description: 0 or omitted = never expires
      required:
        - name

    AgentCapabilities:
      type: object
      properties:
        container_runtimes:
          type: array
          items:
            type: string
        supported_architectures:
          type: array
          items:
            type: string
        max_containers:
          type: integer
        storage_driver:
          type: string
        network_plugins:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            type: string

    NodeResources:
      type: object
      properties:
        cpu:
          type: object
          properties:
            cores:
              type: integer
            allocation:
              type: number
              description: Allocated CPU percentage
            usage:
              type: number
              description: Current usage percentage
        memory:
          type: object
          properties:
            total:
              type: integer
              format: int64
            allocated:
              type: integer
              format: int64
            used:
              type: integer
              format: int64
            available:
              type: integer
              format: int64
        storage:
          type: object
          properties:
            total:
              type: integer
              format: int64
            allocated:
              type: integer
              format: int64
            used:
              type: integer
              format: int64
            available:
              type: integer
              format: int64
        network:
          type: object
          properties:
            interfaces:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  ip_address:
                    type: string
                  mac_address:
                    type: string
                  speed:
                    type: integer
                  status:
                    type: string
            bandwidth:
              type: object
              properties:
                inbound:
                  type: integer
                  format: int64
                  description: Bytes per second
                outbound:
                  type: integer
                  format: int64
                  description: Bytes per second

    RegisterAgentRequest:
      type: object
      required:
        - name
        - hostname
        - ip_address
        - port
        - capabilities
      properties:
        name:
          type: string
        hostname:
          type: string
        ip_address:
          type: string
        port:
          type: integer
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        auth_token:
          type: string
          description: May also be sent via the X-Agent-Token header
        mesh:
          type: object
          additionalProperties:
            type: string
          description: Overlay-network interface IPs (tailscale/netbird/zerotier/wireguard). Stored under agent metadata.mesh; authoritative — send an empty object when no mesh interfaces exist.

    AgentHeartbeat:
      type: object
      properties:
        agent_id:
          type: string
        status:
          type: string
        resources:
          $ref: '#/components/schemas/NodeResources'
        container_count:
          type: integer
        system_load:
          type: object
        uptime:
          type: integer
        version:
          type: string

    AgentCommand:
      type: object
      properties:
        id:
          type: string
        node_agent_id:
          type: string
        type:
          type: string
        payload:
          type: object
        status:
          type: string
          description: pending | running | completed | failed
        result:
          type: string
        error:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    ExecuteCommandRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        payload:
          type: object

    ContainerInstance:
      type: object
      properties:
        id:
          type: string
        agent_id:
          type: string
        project_id:
          type: string
        service_id:
          type: string
        name:
          type: string
        image:
          type: string
        status:
          type: string
        resources:
          type: object
        ports:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time

    CreateContainerRequest:
      type: object
      required:
        - name
        - image
        - project_id
        - service_id
        - resources
      properties:
        name:
          type: string
        image:
          type: string
        project_id:
          type: string
        service_id:
          type: string
        resources:
          type: object
          description: cpu/memory limits
        ports:
          type: array
          items:
            type: object
            properties:
              host_port:
                type: integer
              container_port:
                type: integer
              protocol:
                type: string
        environment:
          type: object
          additionalProperties:
            type: string
        volumes:
          type: array
          items:
            type: object
        networks:
          type: array
          items:
            type: string
        restart_policy:
          type: object
        health_check:
          type: object

    PreviewEnvironment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        preview_service_id:
          type: string
          format: uuid
          description: The cloned service the preview actually deploys; its live status drives the preview status.
        branch_name:
          type: string
        pr_number:
          type: integer
        environment:
          type: string
          description: Generated name, e.g. preview-{branch}-{ts}
        status:
          type: string
          enum: [building, running, failed, stopped, expired]
        url:
          type: string
        expires_at:
          type: string
          format: date-time
        deployment_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePreviewEnvironmentRequest:
      type: object
      required:
        - service_id
        - branch_name
      properties:
        project_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        branch_name:
          type: string
        pr_number:
          type: integer
        ttl_hours:
          type: integer
          minimum: 1
          maximum: 168

    UpdatePreviewEnvironmentRequest:
      type: object
      properties:
        status:
          type: string
          enum: [building, running, failed, stopped, expired]
        url:
          type: string
        expires_at:
          type: string
          format: date-time
        ttl_hours:
          type: integer
          minimum: 1
          maximum: 168

    PromotePreviewEnvironmentRequest:
      type: object
      required:
        - target_environment
      properties:
        target_environment:
          type: string
          enum: [production, development]
        create_backup:
          type: boolean

    StartSecurityScanRequest:
      type: object
      required:
        - project_id
        - scan_type
      properties:
        project_id:
          type: string
        service_id:
          type: string
        scan_type:
          type: string
          enum: [dependency, configuration, comprehensive]

    SecurityScan:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        service_id:
          type: string
        scan_type:
          type: string
        status:
          type: string
          description: pending | running | completed | failed
        findings_count:
          type: integer
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    Vulnerability:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        title:
          type: string
        description:
          type: string
        service_id:
          type: string
        project_id:
          type: string
        status:
          type: string
          enum: [open, resolved, ignored]
        found_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time

    StartComplianceAssessmentRequest:
      type: object
      required:
        - project_id
        - framework_id
      properties:
        project_id:
          type: string
        framework_id:
          type: string

    CronJob:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        service_id:
          type: string
        name:
          type: string
        schedule:
          type: string
          description: Cron expression
        command:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        last_run_at:
          type: string
          format: date-time
        next_run_at:
          type: string
          format: date-time
        last_status:
          type: string
        last_output:
          type: string
        retention:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CronExecution:
      type: object
      properties:
        id:
          type: string
        cron_job_id:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        status:
          type: string
        output:
          type: string
        error:
          type: string

    CreateCronJobRequest:
      type: object
      required:
        - project_id
        - service_id
        - name
        - schedule
        - command
      properties:
        project_id:
          type: string
        service_id:
          type: string
        name:
          type: string
        schedule:
          type: string
        command:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        retention:
          type: integer

    UpdateCronJobRequest:
      type: object
      properties:
        name:
          type: string
        schedule:
          type: string
        command:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        retention:
          type: integer

    GatewayService:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        upstream_url:
          type: string
        route_prefix:
          type: string
        enabled:
          type: boolean
        rpm_limit:
          type: integer
        monthly_quota:
          type: integer
        health_path:
          type: string
        last_validated_at:
          type: string
          format: date-time
        last_validation_status:
          type: string
        created_at:
          type: string
          format: date-time

    GatewayServiceRequest:
      type: object
      required:
        - name
        - upstreamUrl
        - routePrefix
      properties:
        name:
          type: string
          maxLength: 100
        upstreamUrl:
          type: string
          format: uri
          maxLength: 500
        routePrefix:
          type: string
          maxLength: 200
        enabled:
          type: boolean
        rpmLimit:
          type: integer
          minimum: 1
          maximum: 10000
        monthlyQuota:
          type: integer
          minimum: 1
          maximum: 10000000

    GatewayAPIKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
        plan:
          type: string
          enum: [free, pro, business, enterprise]
          default: free
        enabled:
          type: boolean
        rpmLimit:
          type: integer
          minimum: 1
          maximum: 10000
        monthlyQuota:
          type: integer
          minimum: 1
          maximum: 10000000

    GatewayAPIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan:
          type: string
        enabled:
          type: boolean
        rpm_limit:
          type: integer
        monthly_quota:
          type: integer
        key_prefix:
          type: string
        created_at:
          type: string
          format: date-time

    GatewayResponse:
      type: object
      description: Standard gateway management envelope — `data` carries the payload, `error` carries {code, message, details}, `meta` carries pagination.
      properties:
        success:
          type: boolean
        data:
          description: Endpoint-specific payload (GatewayService, GatewayAPIKey, arrays, or analytics objects)
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
        meta:
          type: object
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: string
    ProjectIdParam:
      name: id
      in: path
      required: true
      description: Project ID
      schema:
        type: string
    ServiceIdParam:
      name: serviceId
      in: path
      required: true
      description: Service ID
      schema:
        type: string
    AgentIdParam:
      name: id
      in: path
      required: true
      description: Node agent ID
      schema:
        type: string
    ContainerIdParam:
      name: containerId
      in: path
      required: true
      description: Container ID
      schema:
        type: string

tags:
  - name: Health
