openapi: 3.0.3
info:
  title: Containr API
  description: |
    Self-hosted PaaS on Proxmox - Railway-like platform for container orchestration and deployment.
    
    ## Overview
    Containr provides a comprehensive platform for deploying, managing, and scaling containerized applications on Proxmox infrastructure. This API allows you to manage projects, services, deployments, databases, and more through a RESTful interface.
    
    ## Authentication
    The API accepts three credentials in the Authorization header:
    `Authorization: Bearer <jwt>` (UI sessions), a Better Auth session cookie, or a
    personal access token `cnp_...` (CLI/MCP/agents). PAT scopes: `read` allows only
    GET/HEAD/OPTIONS; `write` everything except admin routes; `admin` requires a
    platform-admin owner.

    ## Errors
    Error responses use `{"error": "human message", "code": "MACHINE_CODE"}`. Stable
    codes: `UNAUTHENTICATED`, `INVALID_TOKEN`, `FORBIDDEN`, `ADMIN_REQUIRED`,
    `SCOPE_INSUFFICIENT`, `NOT_FOUND`, `VALIDATION`, `CONFLICT`, `INTERNAL`,
    `DEPENDENCY_UNAVAILABLE`, `IDEMPOTENCY_IN_PROGRESS`.

    ## Idempotency
    POST endpoints accept an `Idempotency-Key` header. The first response is replayed
    for repeated keys within 24h (scoped to the caller and path); a concurrent duplicate
    receives `409 IDEMPOTENCY_IN_PROGRESS`. Safe for clients to always send a UUID.

    ## Pagination
    List endpoints accept `?limit=` plus either `?page=` (legacy) or `?cursor=`
    (preferred — pass `pagination.next_cursor` from the previous response verbatim).
    Invalid cursors fail soft to the first page.
    
    ## Base URL
    ```
    https://your-containr-domain.com/api/v1
    ```
  version: 1.0.0
  contact:
    name: Containr Documentation
    url: https://github.com/your-org/containr
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://your-containr-domain.com/api/v1
    description: Production server

paths:
  # Health Check
  /health:
    servers:
      - url: http://localhost:8080
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: 'Served at the root, outside /api/v1. Returns dependency status: {"checks":{"database":"ok","redis":"ok"},"service":"containr-api","status":"ok"}'
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # Authentication
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and return JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      tags:
        - Authentication
      summary: User registration
      description: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # User Management
  /user/profile:
    get:
      tags:
        - User
      summary: Get user profile
      description: Retrieve current user's profile information
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - User
      summary: Update user profile
      description: Update current user's profile information
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/tokens:
    get:
      tags:
        - User
      summary: List personal access tokens
      description: Returns the caller's non-revoked personal access token metadata. Token values and hashes are never returned.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserToken'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - User
      summary: Create personal access token
      description: Issues a `cnp_` bearer token for CLI/MCP/agent authentication. The raw token is returned exactly once and never stored — only its SHA-256 hash persists. Admin-scope tokens require a platform admin account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserTokenRequest'
      responses:
        '201':
          description: Token created; raw value returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenCreated'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin scope requires platform admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/tokens/{id}:
    delete:
      tags:
        - User
      summary: Revoke personal access token
      description: Marks one of the caller's tokens as revoked. Clients presenting it are rejected from then on.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Projects
  /projects:
    get:
      tags:
        - Projects
      summary: List projects
      description: Retrieve all projects accessible to the current user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination (legacy — prefer cursor)
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor from a previous response's pagination.next_cursor
          schema:
            type: string
        - name: search
          in: query
          description: Search term to filter projects
          schema:
            type: string
      responses:
        '200':
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsResponse'

    post:
      tags:
        - Projects
      summary: Create project
      description: Create a new project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{id}:
    get:
      tags:
        - Projects
      summary: Get project
      description: Retrieve a specific project by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Project ID
          schema:
            type: string
      responses:
        '200':
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Projects
      summary: Update project
      description: Update a specific project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Project ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Projects
      summary: Delete project
      description: Delete a specific project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Project ID
          schema:
            type: string
      responses:
        '204':
          description: Project deleted successfully
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Services
  /projects/{id}/services:
    get:
      tags:
        - Services
      summary: List project services
      description: Retrieve all services in a project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Project ID
          schema:
            type: string
      responses:
        '200':
          description: Services retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'

    post:
      tags:
        - Services
      summary: Create service
      description: Create a new service in a project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Project ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Service created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'

  /services/{id}:
    get:
      tags:
        - Services
      summary: Get service
      description: Retrieve a specific service
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service ID
          schema:
            type: string
      responses:
        '200':
          description: Service retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'

    put:
      tags:
        - Services
      summary: Update service
      description: Update a specific service
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Service updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'

    delete:
      tags:
        - Services
      summary: Delete service
      description: Delete a specific service
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service ID
          schema:
            type: string
      responses:
        '204':
          description: Service deleted successfully

  /services/{id}/runtime:
    get:
      tags:
        - Services
      summary: Service runtime state
      description: Live container state — replicas, URLs, aggregate status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Runtime state
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime:
                    type: object
                    properties:
                      desired:
                        type: integer
                      status:
                        type: string
                        enum: [running, degraded, stopped]
                      urls:
                        type: array
                        items:
                          type: string
                        description: Reachable service URLs; rewritten to the request Host for remote clients. Null/empty when nothing is published.
                      ports:
                        type: array
                        items:
                          type: integer
                        description: Host ports actually bound for replica 0+; persisted on the service so restarts reuse the same public port. Null/empty when nothing is published.
                      health:
                        type: string
                        enum: [healthy, unhealthy, unreachable]
                        description: Result of the backend's HTTP probe of the service on its project network. Omitted when the service declares no healthcheck path.
                      containers:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            state:
                              type: string
                            replica:
                              type: integer

  /services/{id}/start:
    post:
      tags:
        - Services
      summary: Start service
      description: Start all stopped replicas
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service started

  /services/{id}/stop:
    post:
      tags:
        - Services
      summary: Stop service
      description: Stop all replicas without removing them
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service stopped

  /services/{id}/restart:
    post:
      tags:
        - Services
      summary: Restart service
      description: Restart all replicas
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service restarted

  /services/{id}/sleep:
    post:
      tags:
        - Services
      summary: Sleep service
      description: Scale the service to zero immediately. When it has public domains a wake placeholder holds the route and resumes the service on the next request.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Sleep initiated

  /services/{id}/wake:
    post:
      tags:
        - Services
      summary: Wake service
      description: Reconcile a sleeping service back to running on demand
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Wake initiated

  /services/{id}/env-check:
    get:
      tags:
        - Services
      summary: Environment diagnostics
      description: Reports empty variables, unresolved ${{service.KEY}} references, and secrets whose stored ciphertext fails to decrypt. Values are never returned.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Diagnostic result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  unresolved:
                    type: array
                    items:
                      type: string
                  empty:
                    type: array
                    items:
                      type: string
                  unreadable:
                    type: array
                    items:
                      type: string

  /services/{id}/terminal:
    get:
      tags:
        - Services
      summary: Interactive terminal (WebSocket)
      description: >-
        Upgrades to a WebSocket bridged to a `docker exec` PTY in the
        service's running container (bash if present, else sh).
        Cookie/bearer auth as usual.
        Client→server JSON frames: `{"type":"stdin","data":"..."}`,
        `{"type":"resize","cols":N,"rows":N}`.
        Server→client frames: `{"type":"stdout","data":"..."}`,
        `{"type":"exit","code":N}`, `{"type":"error","message":"..."}`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '101':
          description: Switching protocols — WebSocket session established
        '404':
          description: Service not found or not visible
        '409':
          description: Service has no running container
        '503':
          description: Docker unavailable

  /internal/wake/{id}:
    get:
      tags:
        - Services
      summary: Wake callback (internal)
      description: Unauthenticated wake endpoint hit by the busybox wake placeholder while a slept service resumes. Idempotent and non-destructive.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Wake accepted
        '404':
          description: Service not found

  /services/{id}/redeploy:
    post:
      tags:
        - Services
      summary: Redeploy service
      description: Re-apply the current spec — pulls the image for image-sourced services, reuses the last deployed image otherwise
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reconciled runtime state

  /services/{id}/clone:
    post:
      tags:
        - Services
      summary: Clone service
      description: Duplicates config, volumes, domains, access gates, builder settings, and variables into the same or another project. Containers are not cloned — the copy starts stopped.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name for the clone (default "<name>-copy")
                project_id:
                  type: string
                  format: uuid
                  description: Target project (default same project; caller must own it)
                environment:
                  type: string
                  enum: [production, preview, development]
      responses:
        '201':
          description: Clone created
          content:
            application/json:
              schema:
                type: object
                properties:
                  service_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  message:
                    type: string
        '409':
          description: Name already exists in target project

  /services/{id}/move:
    post:
      tags:
        - Services
      summary: Move service
      description: Re-parents the service to another project the caller owns. Variables, domains, and volumes follow the service; running containers keep running and join the new project's network on next deploy.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Service moved
        '409':
          description: Name conflict in target project

  /registries:
    get:
      tags:
        - Registries
      summary: List registry credentials
      description: Private-image pull credentials for the caller. Passwords are never returned — `has_password` signals presence.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Registry list
          content:
            application/json:
              schema:
                type: object
                properties:
                  registries:
                    type: array
                    items:
                      $ref: '#/components/schemas/Registry'
    post:
      tags:
        - Registries
      summary: Add registry credential
      description: Credentials are matched by image host (e.g. ghcr.io, registry.example.com, docker.io for Docker Hub) on prebuilt-image deploys. Password stored encrypted at rest.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryRequest'
      responses:
        '201':
          description: Registry created
        '409':
          description: A registry for this host already exists

  /registries/{id}:
    put:
      tags:
        - Registries
      summary: Update registry credential
      description: Empty password keeps the stored credential — delete and recreate to remove a password.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryRequest'
      responses:
        '200':
          description: Registry updated
        '404':
          description: Registry not found
    delete:
      tags:
        - Registries
      summary: Remove registry credential
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Registry removed
        '404':
          description: Registry not found

  /backup-targets:
    get:
      tags:
        - BackupTargets
      summary: List backup targets
      description: S3-compatible archive destinations for the caller. Secret keys are never returned — `has_credentials` signals presence.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Backup target list
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup_targets:
                    type: array
                    items:
                      $ref: '#/components/schemas/BackupTarget'
    post:
      tags:
        - BackupTargets
      summary: Register a backup target
      description: The bucket is probed (BucketExists) before storing — typos and bad credentials fail at registration. Keys are stored encrypted at rest.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupTargetRequest'
      responses:
        '201':
          description: Backup target created
        '400':
          description: Validation error or connection check failed

  /backup-targets/{id}:
    put:
      tags:
        - BackupTargets
      summary: Update a backup target
      description: Empty access_key/secret_key keep the stored pair — delete and recreate to remove credentials. Re-probed before saving.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupTargetRequest'
      responses:
        '200':
          description: Backup target updated
        '404':
          description: Backup target not found
    delete:
      tags:
        - BackupTargets
      summary: Delete a backup target
      description: Fails with 409 while databases still point at the target.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Backup target deleted
        '409':
          description: Databases still reference this target

  /backup-targets/{id}/test:
    post:
      tags:
        - BackupTargets
      summary: Re-probe a backup target
      description: Checks bucket access with the stored credentials. Always returns a probe result — `ok` false means unreachable or unauthorized.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  latency_ms:
                    type: integer
                  error:
                    type: string

  /services/{id}/domains:
    get:
      tags:
        - Services
      summary: List service domains
      description: All hostnames attached to the service; the default is mirrored to services.domain
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Domain list
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceDomain'
    post:
      tags:
        - Services
      summary: Attach a domain
      description: Adds a hostname routed to the service via Traefik. The first domain becomes default automatically.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
              properties:
                domain:
                  type: string
                is_default:
                  type: boolean
      responses:
        '201':
          description: Domain attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    $ref: '#/components/schemas/ServiceDomain'
        '409':
          description: Domain already attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{id}/domains/check:
    get:
      tags:
        - Services
      summary: DNS preflight
      description: Resolves every attached domain and compares it to the expected target (app_settings.public_ip / PUBLIC_IP, or base_url host)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Per-domain DNS status
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains:
                    type: array
                    items:
                      $ref: '#/components/schemas/DomainCheckResult'

  /services/{id}/domains/{domain_id}:
    delete:
      tags:
        - Services
      summary: Detach a domain
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Domain removed

  /services/{id}/domains/{domain_id}/default:
    post:
      tags:
        - Services
      summary: Set the default domain
      description: Marks the domain default and mirrors it to services.domain
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated domain list
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceDomain'

  /maintenance:
    get:
      tags:
        - Services
      summary: Maintenance page
      description: Public HTML page Traefik redirects to while a service is in maintenance mode

  /services/{id}/deployments:
    get:
      tags:
        - Deployments
      summary: List deployments
      description: Retrieve recent deployments for a specific service
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service ID
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: cursor
          in: query
          description: Opaque cursor from a previous response's pagination.next_cursor
          schema:
            type: string
      responses:
        '200':
          description: Deployments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentListResponse'

    post:
      tags:
        - Deployments
      summary: Create deployment
      description: Trigger a new deployment for a service
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service ID
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
      responses:
        '201':
          description: Deployment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'

  /deployments:
    get:
      tags:
        - Deployments
      summary: List recent deployments
      description: Latest deployments across all services owned by the caller — feeds the dashboard deploy feed
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response's pagination.next_cursor
          schema:
            type: string
      responses:
        '200':
          description: Recent deployments
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        service_id:
                          type: string
                        service_name:
                          type: string
                        project_name:
                          type: string
                        status:
                          type: string
                        image_name:
                          type: string
                        started_at:
                          type: string
                          nullable: true
                        completed_at:
                          type: string
                          nullable: true
                        created_at:
                          type: string

  /deployments/{id}:
    get:
      tags:
        - Deployments
      summary: Get deployment
      description: Retrieve a deployment with build/runtime details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Deployment ID
          schema:
            type: string
      responses:
        '200':
          description: Deployment retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployment:
                    $ref: '#/components/schemas/Deployment'

  /deployments/{id}/cancel:
    post:
      tags:
        - Deployments
      summary: Cancel a deployment
      description: Cancel a queued or in-flight deployment. Queued deployments are marked cancelled immediately; running ones get their build/reconcile aborted and settle as 'cancelled' shortly after.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Deployment ID
          schema:
            type: string
      responses:
        '200':
          description: Queued deployment cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: cancelled }
        '202':
          description: Running deployment is cancelling
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: cancelling }
        '409':
          description: Deployment already finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /deployments/{id}/rollback:
    post:
      tags:
        - Deployments
      summary: Rollback deployment
      description: Create a rollback deployment from a previous deployment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Deployment ID
          schema:
            type: string
      responses:
        '201':
          description: Rollback initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackDeploymentResponse'

  /services/{id}/logs:
    get:
      tags:
        - Logs
      summary: Get service logs
      description: Retrieve service container logs
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service ID
          schema:
            type: string
        - name: follow
          in: query
          required: false
          description: Stream logs continuously over SSE
          schema:
            type: boolean
            default: false
        - name: tail
          in: query
          required: false
          description: Number of recent log lines to fetch
          schema:
            type: string
            default: '100'
      responses:
        '200':
          description: Service logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceLogsResponse'

  /services/{id}/exec:
    post:
      tags:
        - Services
      summary: Execute command in service container
      description: Runs a one-off shell command via docker exec and returns captured output. 30s ceiling, 64KB output cap. For debugging only.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - command
              properties:
                command:
                  type: string
                  description: Shell command (executed via sh -c)
                  maxLength: 4096
      responses:
        '200':
          description: Command executed (check exit_code/error for failure)
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: string
                  exit_code:
                    type: integer
                  error:
                    type: string
        '400':
          description: Invalid request
        '404':
          description: Service not found
        '409':
          description: No running container for this service
        '503':
          description: Docker unavailable

  /deployments/{id}/logs:
    get:
      tags:
        - Logs
      summary: Get deployment logs
      description: Retrieve build/runtime logs for a deployment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Deployment ID
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Select log stream
          schema:
            type: string
            enum: [all, build, runtime]
            default: all
      responses:
        '200':
          description: Deployment logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentLogsResponse'

  # Builds
  /builds:
    get:
      tags:
        - Builds
      summary: List builds
      description: Retrieve builds with optional filtering and pagination
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          description: Filter by project ID
          schema:
            type: string
        - name: service_id
          in: query
          description: Filter by service ID
          schema:
            type: string
        - name: status
          in: query
          description: Filter by build status
          schema:
            type: string
            enum: [pending, running, success, failed, cancelled]
        - name: page
          in: query
          description: 1-based page number
