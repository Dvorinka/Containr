      description: Create a user-owned template (JSON definition). Requires authentication; the caller becomes the template owner.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateWriteRequest'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  template:
                    $ref: '#/components/schemas/ServiceTemplate'

  /admin/overview:
    get:
      tags:
        - Admin
      summary: Platform overview
      description: Admin-only aggregate statistics plus the pending project approval queue.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Platform overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    type: object
                    additionalProperties:
                      type: integer
                  pending_projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'

  /admin/users:
    get:
      tags:
        - Admin
      summary: List users
      description: Admin-only listing of all platform users.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'

  /admin/users/{id}:
    patch:
      tags:
        - Admin
      summary: Set user admin flag
      description: Grant or revoke platform admin. Admins cannot revoke their own flag.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_admin
              properties:
                is_admin:
                  type: boolean
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /admin/users/{id}/impersonate:
    post:
      tags:
        - Admin
      summary: Impersonate a user
      description: >-
        Mint a 15-minute bearer token acting as the target user. Admin-only;
        admin accounts cannot be impersonated and every mint is audit-logged.
        The token carries an `impersonated_by` claim.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Impersonation token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  user:
                    type: object
                    properties:
                      id: {type: string}
                      email: {type: string}
                      name: {type: string}
        '403':
          description: Target is an admin account

  /admin/projects/{id}:
    patch:
      tags:
        - Admin
      summary: Set project approval
      description: Approve or unapprove a project for public listing.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_approved
              properties:
                is_approved:
                  type: boolean
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
                  message:
                    type: string

  /admin/volumes:
    get:
      tags:
        - Admin
      summary: List docker volumes
      description: Returns the node's docker volume inventory with in-use flags. Admin only.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Volume list
          content:
            application/json:
              schema:
                type: object
                properties:
                  volumes:
                    type: array
                    items:
                      $ref: '#/components/schemas/VolumeInfo'

  /admin/volumes/{name}:
    delete:
      tags:
        - Admin
      summary: Delete a docker volume
      description: Removes an unused docker volume. Docker refuses in-use volumes — returned as 409.
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Volume deleted
        '409':
          description: Volume in use or removal failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /templates/{id}:
    get:
      tags:
        - Templates
      summary: Get template
      description: Retrieve a specific template with parsed config and variables
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Template ID
          schema:
            type: string
      responses:
        '200':
          description: Template retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetailResponse'
    put:
      tags:
        - Templates
      summary: Update a user template
      description: Update a user-created template. Official templates cannot be modified; only the owner or an admin may update.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Template ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateWriteRequest'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  template:
                    $ref: '#/components/schemas/ServiceTemplate'
    delete:
      tags:
        - Templates
      summary: Delete a user template
      description: Delete a user-created template. Official templates cannot be deleted; only the owner or an admin may delete.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Template ID
          schema:
            type: string
      responses:
        '200':
          description: Template deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /templates/{id}/deploy:
    post:
      tags:
        - Templates
      summary: Create resource from template
      description: |
        Create a new resource in a project using a selected template.
        For `database` templates, this creates a managed database service.
        For v2 graph templates (config.services non-empty), this deploys
        the entire service graph — databases first, then services in
        dependency order — and returns `resource: stack` with a `created`
        list. Deployments are enqueued for each service member.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Template ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployTemplateRequest'
      responses:
        '201':
          description: Service created from template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployTemplateResponse'

  /templates/{id}/plan:
    post:
      tags:
        - Templates
      summary: Dry-resolve a template
      description: |
        Resolves a template without creating resources: variable merging,
        `{{secret}}`/`{{random:N}}`/`{{VAR}}`/`{{VAR:-default}}` expression
        expansion and `{{service.<key>.<prop>}}` references. Generated
        secrets are returned masked — a real deploy regenerates them.
        Returns `members` (with resolved environment), `missing_variables`
        and `unresolved` reference names.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Template ID
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                variables:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Resolved plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/TemplatePlanMember'
                  missing_variables:
                    type: array
                    items:
                      type: string
                  unresolved:
                    type: array
                    items:
                      type: string

  /templates/import/compose:
    post:
      tags:
        - Templates
      summary: Convert docker-compose YAML to a template graph
      description: |
        Parses a docker-compose YAML document and returns a v2 template
        config (`version: 2`, `services[]`). Well-known database images
        (postgres, redis, mongo, mysql, mariadb, clickhouse, dragonfly)
        become managed-database members; other images become web services.
        `build:` contexts are flagged in `warnings` — Containr deploys
        images or git repos, not local build contexts. The returned config
        can be saved via POST /templates or deployed directly via
        POST /templates/deploy.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - compose_yaml
              properties:
                compose_yaml:
                  type: string
                  description: Raw docker-compose YAML (max 512 KiB)
      responses:
        '200':
          description: Converted config
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    $ref: '#/components/schemas/TemplateConfig'
                  variables:
                    type: array
                    items:
                      type: object
                  warnings:
                    type: array
                    items:
                      type: string

  /templates/import/git:
    post:
      tags:
        - Templates
      summary: Import a compose file from a git repository
      description: |
        Fetches a compose file out of a git repository and runs it through
        the same conversion as POST /templates/import/compose. `repo`
        accepts a clone URL, ssh remote, or `owner/repo` shorthand —
        connected git providers (including GitHub App installs) supply
        credentials, so private repositories work. `path` defaults to
        `compose.yaml`, `compose.yml`, `docker-compose.yml`, then
        `docker-compose.yaml`; `ref` selects a branch or commit SHA.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - repo
              properties:
                repo:
                  type: string
                  description: Clone URL, ssh remote, or owner/repo shorthand
                path:
                  type: string
                  description: Repo-relative compose file path (searched by convention when empty)
                ref:
                  type: string
                  description: Branch name or 40-char commit SHA
      responses:
        '200':
          description: Converted config
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    $ref: '#/components/schemas/TemplateConfig'
                  variables:
                    type: array
                    items:
                      type: object
                  warnings:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid repo reference, compose file missing, or conversion error
        '502':
          description: Git fetch failed

  /templates/deploy:
    post:
      tags:
        - Templates
      summary: Deploy an ad-hoc service graph
      description: |
        Deploys a v2 graph config (config.services[]) without a stored
        template — the companion to POST /templates/import/compose.
        Members are created in dependency order; `database` members become
        managed databases attached to the project network under their key
        as DNS alias, and deployments are enqueued for service members.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
                - config
              properties:
                project_id:
                  type: string
                config:
                  $ref: '#/components/schemas/TemplateConfig'
                variables:
                  type: object
                  additionalProperties:
                    type: string
                plan:
                  type: string
                region:
                  type: string
      responses:
        '201':
          description: Graph deployed
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    type: string
                  created:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        kind:
                          type: string
                        id:
                          type: string
                        name:
                          type: string
                        deployment_id:
                          type: string

  /projects/{id}/import-compose:
    post:
      tags:
        - Projects
      summary: Deploy a docker-compose file into a project
      description: |
        Parses a docker-compose YAML document and deploys it directly into
        the project — no template row. Well-known database images
        (postgres, mysql, redis, mongo, mariadb, clickhouse, dragonfly)
        become managed databases attached to the project network under
        their service name as DNS alias; other services are created and
        deployed in dependency order. Returns the created resources plus
        any import warnings (unsupported keys, missing values).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - compose_yaml
              properties:
                compose_yaml:
                  type: string
                  description: Full docker-compose YAML document (max 512 KiB)
                variables:
                  type: object
                  additionalProperties:
                    type: string
                plan:
                  type: string
                region:
                  type: string
      responses:
        '201':
          description: Stack deployed
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    type: string
                  created:
                    type: array
                    items:
                      type: object
                  warnings:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid compose YAML or unresolved references
        '403':
          description: Access denied
        '404':
          description: Project not found

  # Agent Onboarding Tokens
  /agent-tokens:
    post:
      tags:
        - Agents
      summary: Issue agent onboarding token
      description: Generates a new agent onboarding token. The raw token is returned once and never stored — only its SHA-256 hash persists.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentTokenRequest'
      responses:
        '201':
          description: Token issued; raw value returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAuthTokenCreated'
    get:
      tags:
        - Agents
      summary: List agent onboarding tokens
      description: Returns issued onboarding token metadata (never token values or hashes).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentAuthToken'

  /agent-tokens/{id}:
    delete:
      tags:
        - Agents
      summary: Revoke agent onboarding token
      description: Marks a token as revoked. Agents presenting it are rejected from then on.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  id:
                    type: string
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Notifications
  /notifications:
    get:
      tags:
        - Notifications
      summary: List notifications for the current user
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Notifications and unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'

  /notifications/{id}/read:
    post:
      tags:
        - Notifications
      summary: Mark a notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /notifications/read-all:
    post:
      tags:
        - Notifications
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All marked read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # Outbound Webhooks
  /webhooks:
    get:
      tags:
        - Webhooks
      summary: List outbound webhooks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Webhooks for the caller (secrets masked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutboundWebhook'
    post:
      tags:
        - Webhooks
      summary: Create an outbound webhook
      description: |
        Receives signed POST deliveries for every audited action matching
        the event list — "resource.action" names, "resource.*" wildcards,
        or "*" for everything. The secret is returned once; deliveries
        carry X-Containr-Signature: sha256=<hmac> over the raw body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - url
                - events
              properties:
                name:
                  type: string
                url:
                  type: string
                secret:
                  type: string
                  description: Signing secret (auto-generated when omitted)
                events:
                  type: array
                  items:
                    type: string
                  example: ["service.*", "deployment.fail"]
                headers:
                  type: object
                  additionalProperties:
                    type: string
                enabled:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Webhook created (secret revealed once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundWebhook'
        '400':
          description: Invalid name, URL, or empty event list

  /webhooks/{id}:
    patch:
      tags:
        - Webhooks
      summary: Update a webhook
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                url:
                  type: string
                secret:
                  type: string
                events:
                  type: array
                  items:
                    type: string
                headers:
                  type: object
                  additionalProperties:
                    type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: Updated webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundWebhook'
        '404':
          description: Webhook not found
    delete:
      tags:
        - Webhooks
      summary: Delete a webhook
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /webhooks/{id}/deliveries:
    get:
      tags:
        - Webhooks
      summary: List delivery attempts for a webhook
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recent deliveries (newest first, max 100)
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'

  /webhooks/{id}/test:
    post:
      tags:
        - Webhooks
      summary: Queue a test ping delivery
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Delivery queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /operations:
    get:
      tags:
        - Operations
      summary: Cross-cutting operations view
      description: |
        Single snapshot of platform work scoped to the caller's projects
        (admins see all): active deployments, in-memory deploy-queue
        depth per service, deployments that failed in the last 24h,
        cron executions and database backups from the last 24h.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Operations snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_deployments:
                    type: array
                    items:
                      type: object
                  deploy_queue:
                    type: array
                    items:
                      type: object
                      properties:
                        service_id:
                          type: string
                        running:
                          type: boolean
                        queued:
                          type: integer
                  recent_failures:
                    type: array
                    items:
                      type: object
                  cron_runs:
                    type: array
                    items:
                      type: object
                  backups:
                    type: array
                    items:
                      type: object

  /activity:
    get:
      tags:
        - Operations
      summary: Activity feed
      description: >-
        Enriched audit events (severity, category, label) scoped to the
        caller's visible projects; admins see everything.
      security:
        - bearerAuth: []
      parameters:
        - {name: severity, in: query, schema: {type: string, enum: [info, success, warning, error]}}
        - {name: category, in: query, schema: {type: string}}
        - {name: resource, in: query, schema: {type: string}}
        - {name: project_id, in: query, schema: {type: string, format: uuid}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 200}}
      responses:
        '200':
          description: Feed entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  page: {type: integer}
                  limit: {type: integer}
                  has_more: {type: boolean}

  /projects/{id}/activity:
    get:
      tags:
        - Operations
      summary: Per-project activity timeline
      description: Audit events correlated to this project's services, deployments, databases and the project record itself.
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 200}}
      responses:
        '200':
          description: Feed entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
        '404':
          description: Project not found or not visible

  /banners/active:
    get:
      tags:
        - Banners
      summary: Active announcement banners
      description: Banners currently active (enabled and within their optional schedule window).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active banners
          content:
            application/json:
              schema:
                type: object
                properties:
                  banners:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        title: {type: string}
                        body: {type: string}
                        level: {type: string, enum: [info, success, warning, error]}
                        active: {type: boolean}
                        dismissible: {type: boolean}
                        starts_at: {type: string, format: date-time, nullable: true}
                        ends_at: {type: string, format: date-time, nullable: true}
                        created_at: {type: string, format: date-time}

  /admin/banners:
    get:
      tags:
        - Banners
      summary: List all banners (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All banners
          content:
            application/json:
              schema:
                type: object
                properties:
                  banners:
                    type: array
                    items:
                      type: object
    post:
      tags:
        - Banners
      summary: Create a banner (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: {type: string}
                body: {type: string}
                level: {type: string, enum: [info, success, warning, error], default: info}
                active: {type: boolean, default: true}
                dismissible: {type: boolean, default: true}
                starts_at: {type: string, format: date-time}
                ends_at: {type: string, format: date-time}
      responses:
        '201':
          description: Created banner
          content:
            application/json:
              schema:
                type: object

  /admin/banners/{id}:
    patch:
      tags:
        - Banners
      summary: Update a banner (admin)
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string}
                body: {type: string}
                level: {type: string, enum: [info, success, warning, error]}
                active: {type: boolean}
                dismissible: {type: boolean}
                starts_at: {type: string, format: date-time}
                ends_at: {type: string, format: date-time}
      responses:
        '200':
          description: Updated banner
          content:
            application/json:
              schema:
                type: object
    delete:
      tags:
        - Banners
      summary: Delete a banner (admin)
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204':
          description: Deleted

  /auth/invites/{token}:
    get:
      tags:
        - Invites
      summary: Validate an invite token (public)
      responses:
        '200':
          description: Invite state
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
                  used: {type: boolean}
                  expired: {type: boolean}
                  email: {type: string, nullable: true}
                  expires_at: {type: string, format: date-time}
        '404':
          description: Invite not found

  /auth/accept-invite:
    post:
      tags:
        - Invites
      summary: Register via an invite link (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, email, password]
              properties:
                token: {type: string}
                name: {type: string}
                email: {type: string}
                password: {type: string, minLength: 8}
      responses:
        '201':
          description: Created session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '410':
          description: Invite used or expired

  /admin/invites:
    get:
      tags:
        - Invites
      summary: List invites (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All invites
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      type: object
    post:
      tags:
        - Invites
      summary: Create an invite link (admin)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string, description: Optionally bind the invite to this email}
                expires_in_hours: {type: integer, default: 168, minimum: 1, maximum: 2160}
      responses:
        '201':
          description: Created invite with one-time token
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: {type: object}
                  token: {type: string, description: Shown once}
                  url: {type: string}

  /admin/invites/{id}:
    delete:
      tags:
        - Invites
      summary: Revoke an invite (admin)
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204':
          description: Revoked

  /branding:
    get:
      tags:
        - Branding
      summary: White-label branding (public)
      description: |
        Instance branding payload — product name, logo/favicon URLs,
        accent color, docs/support links. Unauthenticated so the login
        page and shell can brand themselves before a session exists.
        Unset fields return Containr defaults.
      responses:
        '200':
          description: Branding configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branding'

  # Audit Logs
  /audit-logs:
    get:
      tags:
        - Audit
      summary: List audit logs
      description: Retrieve audit log entries with optional filters
      security:
        - bearerAuth: []
      parameters:
        - name: resource
          in: query
          required: false
          description: Filter audit logs by resource type
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: Filter audit logs by actor email substring
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          description: Filter audit logs by actor user UUID
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          required: false
          description: Only return entries created at or after this RFC3339 timestamp
          schema:
            type: string
            format: date-time
        - name: action
          in: query
          required: false
          description: Filter audit logs by action type
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-based page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of entries per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'

  /audit-logs/{resource}/{id}:
    get:
      tags:
        - Audit
      summary: List resource audit logs
      description: Retrieve audit log entries for a specific resource and resource ID
      security:
        - bearerAuth: []
      parameters:
        - name: resource
          in: path
          required: true
          description: Resource type
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Resource ID
          schema:
            type: string
      responses:
        '200':
          description: Resource audit logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'

  # Databases
  /databases:
    get:
      tags:
        - Databases
      summary: List databases
      description: Retrieve all managed databases for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Databases retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseListResponse'

    post:
      tags:
        - Databases
      summary: Create database
      description: Create a new managed database and start provisioning
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseRequest'
      responses:
        '201':
          description: Database provisioning started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseCreateResponse'

  /databases/register-external:
    post:
      tags:
        - Databases
      summary: Register external database
      description: Record a database hosted elsewhere — connection is probed first (postgres/redis get protocol-level checks, others TCP). Password stored encrypted, never returned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ExternalDatabaseRequest'
                - type: object
                  required: [name]
      responses:
        '201':
          description: External database registered
        '400':
          description: Validation failed or connection probe failed
        '409':
          description: Name already in use

  /databases/test-connection:
    post:
      tags:
        - Databases
      summary: Probe a database connection
      description: Ad-hoc connectivity check — postgres via libpq ping, redis/dragonfly via PING, other engines via TCP dial. Always 200; `ok` carries the result.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalDatabaseRequest'
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  latency_ms:
                    type: integer
                  error:
                    type: string

  /databases/{id}/test-connection:
    post:
      tags:
        - Databases
      summary: Re-probe a registered external database
      description: Uses the stored credentials. External databases only.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Probe result (`ok` carries the outcome)
        '404':
          description: Database not found

  /databases/{id}:
    get:
      tags:
        - Databases
      summary: Get database
      description: Retrieve a specific database
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Database ID
          schema:
            type: string
      responses:
        '200':
          description: Database retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
    put:
      tags:
        - Databases
      summary: Update database
      description: Update mutable database metadata (name or plan)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Database ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseRequest'
      responses:
        '200':
          description: Database updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      tags:
        - Databases
      summary: Delete database
      description: Delete managed database and associated runtime
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Database ID
          schema:
            type: string
      responses:
        '200':
          description: Database deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /databases/{id}/action:
    post:
      tags:
        - Databases
      summary: Execute database action
      description: Execute start, stop, or restart action for a managed database
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Database ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseActionRequest'
      responses:
        '200':
          description: Action accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseActionResponse'

  /databases/{id}/backup:
    post:
      tags:
        - Databases
      summary: Create backup
      description: Create a managed snapshot backup for a database
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Database ID
          schema:
            type: string
      responses:
        '201':
          description: Backup started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBackupCreateResponse'

  /databases/{id}/restore:
    post:
      tags:
        - Databases
      summary: Restore backup
      description: Restore a managed database from a completed backup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Database ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseRestoreRequest'
      responses:
        '200':
          description: Restore started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /databases/{id}/backups/import:
    post:
      tags:
        - Databases
      summary: Import a backup archive
      description: >-
        Upload a `.tar.gz` archive (multipart field `file` or a raw
        application/gzip body) to create a new restore point. The archive
        lands in the backup volume and, when a backup target is assigned,
        is also shipped offsite. Managed databases only; 2 GiB ceiling.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Database ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
          application/gzip:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Backup imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup_id:
                    type: string
                  size:
                    type: string
                  status:
                    type: string
        '400':
          description: Invalid archive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Archive too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /databases/{id}/backups/{bid}/download:
    get:
      tags:
        - Databases
      summary: Download a completed backup archive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: bid
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Backup archive stream
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '404':
          description: Backup not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Backup not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Git Integration
  /git/providers:
    get:
      tags:
        - Git
      summary: List Git providers
      description: Retrieve available Git providers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Git providers retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitProvider'

    post:
      tags:
        - Git
      summary: Add Git provider
      description: Add a new Git provider
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGitProviderRequest'
      responses:
        '201':
          description: Git provider added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitProvider'

  /git/providers/{providerId}/repositories:
    get:
      tags:
        - Git
      summary: List repositories
      description: Retrieve repositories from a Git provider
      security:
        - bearerAuth: []
      parameters:
        - name: providerId
          in: path
          required: true
          description: Git provider ID
          schema:
            type: string
      responses:
        '200':
          description: Repositories retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitRepository'

  # Top-level probes (served outside /api/v1)
  /live:
    servers:
      - url: http://localhost:8080
    get:
      tags:
        - Health
      summary: Liveness probe
      description: Process liveness check served at the root, outside /api/v1.
      responses:
        '200':
          description: Process is alive

  /ready:
    servers:
      - url: http://localhost:8080
    get:
      tags:
        - Health
      summary: Readiness probe
      description: Same handler as /health — reports database and Redis status.
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # Authentication
  /auth/bootstrap:
    get:
      tags:
        - Authentication
      summary: Bootstrap status
      description: Reports whether the instance already has a registered user, which auth providers are configured, and whether public registration is open. Drives the first-run setup gate.
      responses:
        '200':
          description: Bootstrap state
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_users:
                    type: boolean
                    description: True when at least one account exists
                  user_count:
                    type: integer
                  mode:
                    type: string
                    enum: [register, login]
                    description: register when the instance has no users, login otherwise
                  providers:
                    type: array
                    items:
                      type: string
                    description: OAuth providers with real credentials configured (e.g. github, google). Empty on self-hosted installs.
                  signup_enabled:
                    type: boolean
                    description: True when the owner re-opened public registration in Settings

  /settings:
    get:
      tags:
        - Settings
      summary: Read platform settings
      description: Admin only. Returns in-app settings that override environment variables.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current platform settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        '403':
          description: Admin access required
    put:
      tags:
        - Settings
      summary: Update platform settings
      description: Admin only. Provided keys are applied immediately; the Cloudflare tunnel token starts/stops the managed cloudflared sidecar.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signup_enabled:
                  type: boolean
                  description: Allow new public account registration after bootstrap
                cloudflare_tunnel_token:
                  type: string
                  description: Cloudflare Tunnel token. Empty string clears the stored token and removes the cloudflared container.
                branding:
                  type: object
                  description: White-label fields. Empty string clears a field back to the Containr default.
                  properties:
                    product_name: {type: string}
                    logo_url: {type: string}
                    favicon_url: {type: string}
                    accent_color: {type: string}
                    docs_url: {type: string}
                    support_url: {type: string}
      responses:
        '200':
          description: Updated platform settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        '403':
          description: Admin access required

  # User Management
  /users:
    post:
      tags:
        - User
      summary: Create user (manual)
      description: Manually create a user account. Used for internal/admin user creation outside the bootstrap flow.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualUserCreateRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Services
  /services/{id}/metrics:
    get:
      tags:
        - Services
      summary: Service metrics
      description: Live resource usage for the service's containers (CPU, memory, network, block I/O via Docker stats).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current service metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    $ref: '#/components/schemas/ServiceMetrics'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /services/{id}/variables:
    get:
      tags:
        - Services
      summary: List service variables
      description: Environment variables for a service. Secret values are masked.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Variables retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  variables:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceVariable'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Services
      summary: Replace service variables
      description: Replace the full variable set for a service.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVariablesRequest'
      responses:
        '200':
          description: Variables updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  variables:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceVariable'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{id}/variables:
    get:
      tags:
        - Projects
      summary: List shared project variables
      description: Project-level variables shared across services. Services reference them as `${{shared.KEY}}` in environment values — resolved at deploy/reconcile, not live-updated. Secret values are masked.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Variables retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  variables:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceVariable'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Projects
      summary: Replace shared project variables
      description: Replace the full shared-variable set for a project. Fetch the current list first and merge — the server replaces wholesale. Masked secret placeholders (`********`) keep the stored value.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVariablesRequest'
      responses:
        '200':
          description: Variables updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  variables:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceVariable'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Git integration
  /git/github-app/install-url:
    get:
      tags:
        - Git
      summary: GitHub App install URL
      description: Returns the URL to install the Containr GitHub App, or 404 when no app is configured.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Install URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  install_url:
                    type: string
                    format: uri
        '404':
          description: GitHub App not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /git/github-app/connect:
    post:
      tags:
        - Git
      summary: Connect GitHub App installation
      description: Register a completed GitHub App installation as a git provider.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectGitHubAppRequest'
      responses:
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitProvider'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/git/github-app:
    get:
      tags:
        - Admin
      summary: GitHub App provisioning status
      description: Shows whether the instance GitHub App is configured, and whether credentials come from app_settings or environment variables.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Provisioning status
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: {type: boolean}
                  source: {type: string, enum: [settings, env, none]}
                  app_id: {type: string}
                  slug: {type: string}
                  name: {type: string}

  /admin/git/github-app/manifest:
    post:
      tags:
        - Admin
      summary: Build GitHub App manifest
      description: >-
        Returns a GitHub App manifest for self-provisioning. The client POSTs
        `manifest` verbatim as a form field to `url`; GitHub then redirects to
        the instance's /git/github-app/callback with a code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url]
              properties:
                base_url: {type: string, description: Public https base URL of this instance}
                name: {type: string}
                organization: {type: string, description: Create the app under this GitHub organization}
      responses:
        '200':
          description: Manifest + submission URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: {type: string}
                  manifest: {type: string, description: JSON string — POST as form field `manifest`}
                  state: {type: string}

  /admin/git/github-app/convert:
    post:
      tags:
        - Admin
      summary: Exchange manifest callback code
      description: Exchanges the `code` from the manifest redirect for the app credentials and stores them in app_settings (overriding env vars).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
      responses:
        '200':
          description: App provisioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  app_id: {type: integer}
                  slug: {type: string}
                  name: {type: string}
        '502':
          description: GitHub conversion failed

  /git/providers/{providerId}:
    delete:
      tags:
        - Git
      summary: Delete git provider
      description: Remove a git provider and its stored credentials.
      security:
        - bearerAuth: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /git/providers/{providerId}/repositories/{owner}/{repo}/branches:
    get:
      tags:
        - Git
      summary: List repository branches
      description: List branches for a repository through the provider API.
      security:
        - bearerAuth: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Branches retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  branches:
                    type: array
                    items:
                      $ref: '#/components/schemas/GitBranch'
        '502':
          description: Provider API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /git/repositories/connect:
    post:
      tags:
        - Git
      summary: Connect repository
      description: Connect a provider repository so it can back services and webhooks.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectGitRepoRequest'
      responses:
        '201':
          description: Repository connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitRepository'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /git/repositories:
    get:
      tags:
        - Git
      summary: List connected repositories
      description: Repositories connected to Containr across all providers.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Connected repositories
          content:
            application/json:
              schema:
                type: object
                properties:
                  repositories:
                    type: array
                    items:
                      $ref: '#/components/schemas/GitRepository'

  /git/webhooks:
    post:
      tags:
        - Git
      summary: Create webhook
      description: Register a webhook on a connected repository to trigger deployments on push.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitWebhook'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Builds
  /builds/plan:
