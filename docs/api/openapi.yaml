        - Agents
      summary: Node options for service placement
      description: Minimal id/name/status list of registered node agents — available to any authenticated user for the service placement picker. Full agent data is admin-only under /agents.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Node options
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                        tags:
                          type: array
                          items: { type: string }

  /agents:
    get:
      tags:
        - Agents
      summary: List node agents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All registered node agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: '#/components/schemas/NodeAgent'

  /agents/{id}:
    get:
      tags:
        - Agents
      summary: Get node agent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentIdParam'
      responses:
        '200':
          description: Agent detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    $ref: '#/components/schemas/NodeAgent'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Agents
      summary: Update node agent
      description: Partial update — accepts any subset of agent fields (name, status, auto_prune, tags, default_domain). `tags` sets the node's placement labels; services with placement_tags only schedule onto agents carrying every required tag. `default_domain` gives the node a base domain — domainless services placed there get `<name>.<default_domain>` auto-hostnames; empty string clears it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Subset of NodeAgent fields to update
      responses:
        '200':
          description: Agent updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    $ref: '#/components/schemas/NodeAgent'
    delete:
      tags:
        - Agents
      summary: Deregister node agent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentIdParam'
      responses:
        '200':
          description: Agent removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

