  /api/agents/install.sh:
    servers:
      - url: http://localhost:8080
    get:
      tags:
        - Agents
      summary: Agent install script
      description: Public bootstrap script — `curl | bash -s -- --url <api> --token <enroll-token>`.
      security: []
      responses:
        '200':
          description: Bourne shell installer
          content:
            text/x-sh:
              schema:
                type: string

  /api/agents/download/{platform}:
    servers:
      - url: http://localhost:8080
    get:
      tags:
        - Agents
      summary: Download a bundled agent binary
      description: "platform: linux-amd64 | linux-arm64. Bundled in release images; 404 when absent (install script falls back to GH releases)."
      security: []
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [linux-amd64, linux-arm64]
      responses:
        '200':
          description: Agent binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: No bundled binary for platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /agents/{id}/prune:
    post:
      tags:
        - Agents
      summary: Enqueue a bounded docker prune on a node
      description: Queues a `prune` command — `docker system prune -af`, volumes excluded unless requested.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                until:
                  type: string
                  description: Only prune objects older than this duration (e.g. "168h").
                volumes:
                  type: boolean
                  description: Also prune volumes — destructive, off by default.
      responses:
        '202':
          description: Prune command queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  command:
                    $ref: '#/components/schemas/AgentCommand'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /agents/{id}/cordon:
    post:
      tags:
        - Agents
      summary: Cordon a node
      description: >-
        Sets `schedulable=false`: new explicit pins are rejected and `auto`
        placement skips the node. Already-pinned services keep running and can
        still reconcile — drain to evict them.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentIdParam'
      responses:
        '200':
          description: Node cordoned
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  schedulable: { type: boolean }
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /agents/{id}/uncordon:
    post:
      tags:
        - Agents
      summary: Uncordon a node
      description: Re-opens the node for placement (`schedulable=true`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentIdParam'
      responses:
        '200':
          description: Node uncordoned
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  schedulable: { type: boolean }
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /agents/{id}/drain:
    post:
      tags:
        - Agents
      summary: Drain a node
      description: >-
        Cordons the node, removes every service container via the agent
        command queue, and clears the affected services' `node_id` pins —
        they fall back to the local host on next deploy and can be re-pinned
        elsewhere. Requires the node to be online so it can acknowledge the
        removals.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentIdParam'
      responses:
        '200':
          description: Node drained
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  schedulable: { type: boolean }
                  services_drained: { type: integer }
                  services_unpinned: { type: integer }
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Node is not online
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /agents/{id}/upgrade:
    post:
      tags:
        - Agents
      summary: Upgrade the node agent
      description: >-
        Enqueues a `self_upgrade` command. The agent downloads its
        replacement binary from this server's bundled `/agents/download`
        endpoint, verifies the sha256, atomically swaps the executable, and
        re-execs itself — the command result reports before the process
        swaps. The node must be online, and the server must bundle a binary
        for the node's architecture (`linux-amd64`/`linux-arm64`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentIdParam'
      responses:
        '202':
          description: Upgrade command enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  command: { type: object }
                  platform: { type: string }
