      tags:
        - Builds
      summary: Preview build plan
      description: Resolve how a build would run (detected build type, commands) without executing it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildRequest'
      responses:
        '200':
          description: Resolved build plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    type: object
                    description: Detected build type, commands, and resolved options
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

