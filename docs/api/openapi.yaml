  /api/git/webhooks/{id}:
    servers:
      - url: http://localhost:8080
    post:
      tags:
        - Git
      summary: Push event receiver
      description: >-
        Public provider webhook endpoint. The HMAC signature against the stored
        webhook secret replaces session auth: GitHub X-Hub-Signature-256,
        Gitea X-Gitea-Signature, GitLab X-Gitlab-Token. Matching branch pushes
        enqueue deployments for connected services.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider push payload (ref, repository, head_commit)
      responses:
        '202':
          description: Push accepted; matched services queued for deployment
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  branch:
                    type: string
                  deployments:
                    type: integer
                  ignored:
                    type: string
        '400':
          description: Invalid webhook ID or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Webhook disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Webhook or repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/git/github-app/webhook:
    servers:
      - url: http://localhost:8080
    post:
      tags:
        - Git
      summary: GitHub App webhook receiver
      description: >-
        Single app-level webhook all installed repositories deliver to
        (configured via the manifest's hook_attributes). Verified with
        X-Hub-Signature-256 against the provisioned webhook secret. Push
        events enqueue deployments for services tracking the repo+branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  branch:
                    type: string
                  deployments:
                    type: integer
                  ignored:
                    type: string
        '401':
          description: Invalid signature
        '503':
          description: GitHub App webhook secret not configured

