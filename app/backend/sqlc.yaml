version: "2"
sql:
  - engine: "postgresql"
    schema: "sqlc/schema.sql"
    queries: "sqlc/queries"
    gen:
      go:
        package: "sqlcdb"
        out: "internal/database/sqlcdb"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
